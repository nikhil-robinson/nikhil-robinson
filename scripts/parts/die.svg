<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="NR-26 die floorplan: each functional block is one of Nikhil Robinson's skill areas">
  <title>NR-26 die floorplan</title>
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#16202b" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3ee6c1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3ee6c1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ee6c1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .t  { fill: #e6edf3; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
    .s  { fill: #8b9bb0; font-size: 11.5px; }
    .k  { fill: #3ee6c1; font-size: 10px; letter-spacing: 2px; }
    .pl { fill: #6b7c91; font-size: 9px; letter-spacing: 1px; }
    .blk { fill: #111a24; stroke-width: 1.5; opacity: 0; animation: on .5s ease-out forwards; }
    .lbl { opacity: 0; animation: on .5s ease-out forwards; }
    .c1 { stroke: #3ee6c1; } .c2 { stroke: #ffb547; } .c3 { stroke: #ff5d8f; } .c4 { stroke: #7aa2ff; }
    .d1 { animation-delay: .3s } .d2 { animation-delay: .6s } .d3 { animation-delay: .9s } .d4 { animation-delay: 1.2s }
    .d5 { animation-delay: 1.5s } .d6 { animation-delay: 1.8s } .d7 { animation-delay: 2.1s } .d8 { animation-delay: 2.4s }
    .core { fill: #0d151e; stroke: #3ee6c1; stroke-width: 1; animation: core 2.4s ease-in-out infinite; }
    .core:nth-of-type(2) { animation-delay: .6s } .core:nth-of-type(3) { animation-delay: 1.2s } .core:nth-of-type(4) { animation-delay: 1.8s }
    .bus { fill: none; stroke: #1f3142; stroke-width: 6; stroke-linecap: round; }
    .flow { fill: none; stroke: #3ee6c1; stroke-width: 2; stroke-dasharray: 4 18; stroke-linecap: round; animation: flow 1.4s linear infinite; opacity: .7; }
    .flow2 { stroke: #ffb547; animation-duration: 2.1s; animation-direction: reverse; }
    .pad { fill: #1a2633; stroke: #2b3d50; animation: pad 3s ease-in-out infinite; }
    .scan { animation: scan 6s linear infinite; }
    .led { fill: #3ee6c1; animation: blink 1.2s steps(2) infinite; }
    @keyframes on { to { opacity: 1 } }
    @keyframes core { 0%,100% { fill: #0d151e } 50% { fill: #154d44 } }
    @keyframes flow { to { stroke-dashoffset: -44 } }
    @keyframes pad { 0%,100% { fill: #1a2633 } 50% { fill: #2f5a52 } }
    @keyframes scan { from { transform: translateY(-80px) } to { transform: translateY(560px) } }
    @keyframes blink { 50% { opacity: .15 } }
  </style>

  <!-- package + die -->
  <rect width="960" height="560" rx="18" fill="#0a0e13"/>
  <rect x="34" y="34" width="892" height="492" rx="6" fill="#0e141b" stroke="#24313f" stroke-width="2"/>
  <rect x="70" y="70" width="820" height="420" fill="url(#grid)"/>

  <!-- pad ring -->
  <g id="pads">
    <g class="pads-top">
      <rect class="pad" x="96"  y="44" width="44" height="16" rx="2" style="animation-delay:0s"/>
      <rect class="pad" x="152" y="44" width="44" height="16" rx="2" style="animation-delay:.15s"/>
      <rect class="pad" x="208" y="44" width="44" height="16" rx="2" style="animation-delay:.3s"/>
      <rect class="pad" x="264" y="44" width="44" height="16" rx="2" style="animation-delay:.45s"/>
      <rect class="pad" x="320" y="44" width="44" height="16" rx="2" style="animation-delay:.6s"/>
      <rect class="pad" x="376" y="44" width="44" height="16" rx="2" style="animation-delay:.75s"/>
      <rect class="pad" x="432" y="44" width="44" height="16" rx="2" style="animation-delay:.9s"/>
      <rect class="pad" x="488" y="44" width="44" height="16" rx="2" style="animation-delay:1.05s"/>
      <rect class="pad" x="544" y="44" width="44" height="16" rx="2" style="animation-delay:1.2s"/>
      <rect class="pad" x="600" y="44" width="44" height="16" rx="2" style="animation-delay:1.35s"/>
      <rect class="pad" x="656" y="44" width="44" height="16" rx="2" style="animation-delay:1.5s"/>
      <rect class="pad" x="712" y="44" width="44" height="16" rx="2" style="animation-delay:1.65s"/>
      <rect class="pad" x="768" y="44" width="44" height="16" rx="2" style="animation-delay:1.8s"/>
      <rect class="pad" x="824" y="44" width="44" height="16" rx="2" style="animation-delay:1.95s"/>
    </g>
    <g class="pl" text-anchor="middle">
      <text x="118" y="56">SPI</text><text x="174" y="56">I2C</text><text x="230" y="56">UART</text>
      <text x="286" y="56">I2S</text><text x="342" y="56">CAN</text><text x="398" y="56">USB</text>
      <text x="454" y="56">ETH</text><text x="510" y="56">JTAG</text><text x="566" y="56">SWD</text>
      <text x="622" y="56">MQTT</text><text x="678" y="56">TCP</text><text x="734" y="56">UDP</text>
      <text x="790" y="56">WS</text><text x="846" y="56">HTTP</text>
    </g>
    <g>
      <rect class="pad" x="44" y="96"  width="16" height="36" rx="2" style="animation-delay:.2s"/>
      <rect class="pad" x="44" y="148" width="16" height="36" rx="2" style="animation-delay:.5s"/>
      <rect class="pad" x="44" y="200" width="16" height="36" rx="2" style="animation-delay:.8s"/>
      <rect class="pad" x="44" y="252" width="16" height="36" rx="2" style="animation-delay:1.1s"/>
      <rect class="pad" x="44" y="304" width="16" height="36" rx="2" style="animation-delay:1.4s"/>
      <rect class="pad" x="44" y="356" width="16" height="36" rx="2" style="animation-delay:1.7s"/>
      <rect class="pad" x="44" y="408" width="16" height="36" rx="2" style="animation-delay:2s"/>
      <rect class="pad" x="900" y="96"  width="16" height="36" rx="2" style="animation-delay:.35s"/>
      <rect class="pad" x="900" y="148" width="16" height="36" rx="2" style="animation-delay:.65s"/>
      <rect class="pad" x="900" y="200" width="16" height="36" rx="2" style="animation-delay:.95s"/>
      <rect class="pad" x="900" y="252" width="16" height="36" rx="2" style="animation-delay:1.25s"/>
      <rect class="pad" x="900" y="304" width="16" height="36" rx="2" style="animation-delay:1.55s"/>
      <rect class="pad" x="900" y="356" width="16" height="36" rx="2" style="animation-delay:1.85s"/>
      <rect class="pad" x="900" y="408" width="16" height="36" rx="2" style="animation-delay:2.15s"/>
    </g>
  </g>

  <!-- interconnect -->
  <path class="bus" d="M90 280 H870 M370 90 V470 M590 90 V470"/>
  <path class="flow" d="M90 280 H870"/>
  <path class="flow flow2" d="M370 90 V470"/>
  <path class="flow" d="M590 470 V90" style="animation-duration:1.8s"/>

  <!-- CPU cluster -->
  <rect class="blk c1 d1" x="90" y="90" width="270" height="180" rx="4"/>
  <g class="lbl d1">
    <text class="k" x="104" y="110">CPU CLUSTER</text>
    <g>
      <rect class="core" x="104" y="122" width="116" height="62" rx="3"/>
      <rect class="core" x="230" y="122" width="116" height="62" rx="3"/>
      <rect class="core" x="104" y="194" width="116" height="62" rx="3"/>
      <rect class="core" x="230" y="194" width="116" height="62" rx="3"/>
    </g>
    <text class="t" x="162" y="159" text-anchor="middle">C</text>
    <text class="t" x="288" y="159" text-anchor="middle">C++</text>
    <text class="t" x="162" y="231" text-anchor="middle">RUST</text>
    <text class="t" x="288" y="231" text-anchor="middle">BASH</text>
  </g>

  <!-- NPU -->
  <rect class="blk c3 d2" x="380" y="90" width="200" height="180" rx="4"/>
  <g class="lbl d2">
    <text class="k" x="394" y="110">NPU / VISION</text>
    <text class="t" x="394" y="146">ON-DEVICE AI</text>
    <text class="s" x="394" y="172">PyTorch · TensorFlow</text>
    <text class="s" x="394" y="192">Keras · OpenCV</text>
    <text class="s" x="394" y="212">features2d on the edge</text>
    <g fill="#ff5d8f" opacity=".55">
      <rect x="394" y="232" width="10" height="22"><animate attributeName="height" values="22;8;22" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="410" y="232" width="10" height="22"><animate attributeName="height" values="10;22;10" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="426" y="232" width="10" height="22"><animate attributeName="height" values="16;4;16" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="442" y="232" width="10" height="22"><animate attributeName="height" values="6;20;6" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="458" y="232" width="10" height="22"><animate attributeName="height" values="20;12;20" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- secure enclave -->
  <rect class="blk c2 d3" x="600" y="90" width="270" height="84" rx="4"/>
  <g class="lbl d3">
    <text class="k" x="614" y="110" style="fill:#ffb547">SECURE ENCLAVE</text>
    <text class="t" x="614" y="138">ROOT OF TRUST</text>
    <text class="s" x="614" y="160">Secure Boot · Flash Enc · AES</text>
  </g>

  <!-- boot ROM -->
  <rect class="blk c2 d4" x="600" y="186" width="270" height="84" rx="4"/>
  <g class="lbl d4">
    <text class="k" x="614" y="206" style="fill:#ffb547">BOOT ROM</text>
    <text class="t" x="614" y="234">BOOT CHAIN</text>
    <text class="s" x="614" y="256">U-Boot · OTA · A/B · bring-up</text>
  </g>

  <!-- kernel / BSP -->
  <rect class="blk c4 d5" x="90" y="290" width="270" height="180" rx="4"/>
  <g class="lbl d5">
    <text class="k" x="104" y="310" style="fill:#7aa2ff">APPLICATION SUBSYSTEM</text>
    <text class="t" x="104" y="346">LINUX / BSP</text>
    <text class="s" x="104" y="372">Kernel drivers · Device Tree</text>
    <text class="s" x="104" y="392">Yocto · Buildroot</text>
    <text class="s" x="104" y="412">Qt · Slint · LVGL</text>
    <text class="s" x="104" y="452" style="fill:#7aa2ff">$ uname -m → riscv64 | aarch64</text>
  </g>

  <!-- RT core -->
  <rect class="blk c1 d6" x="380" y="290" width="200" height="84" rx="4"/>
  <g class="lbl d6">
    <text class="k" x="394" y="310">RT CORE</text>
    <text class="t" x="394" y="338">REAL-TIME</text>
    <text class="s" x="394" y="360">FreeRTOS · Zephyr</text>
  </g>

  <!-- motion -->
  <rect class="blk c3 d7" x="380" y="386" width="200" height="84" rx="4"/>
  <g class="lbl d7">
    <text class="k" x="394" y="406" style="fill:#ff5d8f">MOTION ENGINE</text>
    <text class="t" x="394" y="434">ROBOTICS</text>
    <text class="s" x="394" y="456">ROS 2 · AHRS · fusion</text>
  </g>

  <!-- RF -->
  <rect class="blk c4 d8" x="600" y="290" width="270" height="180" rx="4"/>
  <g class="lbl d8">
    <text class="k" x="614" y="310" style="fill:#7aa2ff">RF FRONT-END</text>
    <text class="t" x="614" y="346">CONNECTIVITY</text>
    <text class="s" x="614" y="372">Wi-Fi · BLE · LoRaWAN</text>
    <text class="s" x="614" y="392">LTE · NB-IoT · NFC/RFID</text>
    <g fill="none" stroke="#7aa2ff" stroke-width="2" stroke-linecap="round">
      <path d="M800 440 a10 10 0 0 1 0 -20" opacity=".9"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></path>
      <path d="M790 450 a22 22 0 0 1 0 -40" opacity=".6"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin=".25s" repeatCount="indefinite"/></path>
      <path d="M780 460 a34 34 0 0 1 0 -60" opacity=".3"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin=".5s" repeatCount="indefinite"/></path>
      <path d="M820 420 a10 10 0 0 1 0 20" opacity=".9"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></path>
      <path d="M830 410 a22 22 0 0 1 0 40" opacity=".6"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin=".25s" repeatCount="indefinite"/></path>
      <path d="M840 400 a34 34 0 0 1 0 60" opacity=".3"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin=".5s" repeatCount="indefinite"/></path>
    </g>
    <circle cx="810" cy="430" r="4" fill="#7aa2ff"/>
  </g>

  <!-- scan line -->
  <rect class="scan" x="70" y="0" width="820" height="80" fill="url(#scan)"/>

  <!-- die markings -->
  <circle class="led" cx="62" cy="513" r="4"/>
  <text class="pl" x="74" y="516">PWR</text>
  <text class="pl" x="898" y="516" text-anchor="end">NR-26 · REV B · © NIKHIL ROBINSON · MADE IN THE LAB</text>
</svg>

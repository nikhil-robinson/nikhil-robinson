<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
  <!-- Desktop die floorplan. {{tokens}} are filled from the content tables in render_profile.py -->
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#16202b" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3ee6c1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3ee6c1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ee6c1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .t  { fill: #e6edf3; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
    .s  { fill: #b4c0cc; font-size: 13.5px; }
    .k  { font-size: 11px; letter-spacing: 2px; font-weight: 700; }
    .pl { fill: #a9b6c4; font-size: 10px; font-weight: 700; }
    .blk { fill: #111a24; stroke-width: 1.5; }
    .core { fill: #0d151e; stroke: #3ee6c1; stroke-width: 1; animation: core 2.4s ease-in-out infinite; }
    .bus { fill: none; stroke: #1f3142; stroke-width: 6; stroke-linecap: round; }
    .flow { fill: none; stroke: #3ee6c1; stroke-width: 2; stroke-dasharray: 4 18; stroke-linecap: round; animation: flow 1.4s linear infinite; opacity: .7; }
    .flow2 { stroke: #ffb547; animation-duration: 2.1s; animation-direction: reverse; }
    .pad { fill: #1a2633; stroke: #2b3d50; animation: pad 3s ease-in-out infinite; }
    .scan { animation: scan 6s linear infinite; }
    .led { fill: #3ee6c1; animation: blink 1.2s steps(2) infinite; }
    @keyframes core { 0%,100% { fill: #0d151e } 50% { fill: #154d44 } }
    @keyframes flow { to { stroke-dashoffset: -44 } }
    @keyframes pad { 0%,100% { fill: #1a2633 } 50% { fill: #2f5a52 } }
    @keyframes scan { from { transform: translateY(-80px) } to { transform: translateY(680px) } }
    @keyframes blink { 50% { opacity: .15 } }
  </style>

  <rect width="960" height="680" rx="18" fill="#0a0e13"/>
  <rect x="34" y="34" width="892" height="612" rx="6" fill="#0e141b" stroke="#24313f" stroke-width="2"/>
  <rect x="70" y="70" width="820" height="540" fill="url(#grid)"/>

  {{TOP_PADS}}
  {{BOTTOM_PADS}}
  {{SIDE_PADS}}

  <path class="bus" d="M84 256 H876 M84 428 H876 M282 84 V600 M480 84 V600 M678 84 V600"/>
  <path class="flow" d="M84 256 H876"/>
  <path class="flow" d="M876 428 H84" style="animation-duration:1.7s"/>
  <path class="flow flow2" d="M282 84 V600"/>
  <path class="flow" d="M480 600 V84" style="animation-duration:1.9s"/>
  <path class="flow flow2" d="M678 84 V600" style="animation-duration:2.4s"/>

  {{BLOCKS}}

  <rect class="scan" x="70" y="0" width="820" height="80" fill="url(#scan)"/>
  <circle class="led" cx="62" cy="663" r="4"/>
  <text class="pl" x="74" y="666">PWR</text>
  <text class="pl" x="898" y="666" text-anchor="end">NR-26 · REV C · NIKHIL ROBINSON</text>
</svg>

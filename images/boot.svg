<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-label="Boot log of the NR-26: boot ROM, U-Boot, Linux kernel probing skills, then a login prompt">
  <title>NR-26 boot log</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #c9d4df; white-space: pre; }
    .ts  { fill: #56677a; }
    .ok  { fill: #3ee6c1; }
    .wr  { fill: #ffb547; }
    .hi  { fill: #ff5d8f; }
    .bl  { fill: #7aa2ff; }
    .dim { fill: #6b7c91; }
    .ln  { opacity: 0; animation: show .25s ease-out forwards; }
    .cur { fill: #3ee6c1; opacity: 0; animation: show .1s forwards, blink 1s steps(2) infinite; }
    @keyframes show { to { opacity: 1 } }
    @keyframes blink { 50% { fill-opacity: 0 } }
  </style>

  <rect width="960" height="390" rx="14" fill="#0a0e13"/>
  <rect x="0.5" y="0.5" width="959" height="389" rx="14" fill="none" stroke="#24313f"/>
  <circle cx="26" cy="22" r="6" fill="#ff5d8f"/><circle cx="46" cy="22" r="6" fill="#ffb547"/><circle cx="66" cy="22" r="6" fill="#3ee6c1"/>
  <text x="480" y="27" text-anchor="middle" class="dim" style="font-size:12px">ttyS0 · 115200 8N1 · nikhil@nr-26</text>
  <line x1="0" y1="42" x2="960" y2="42" stroke="#1a2430"/>

  <g>
    <text class="ln" x="24" y="72" style="animation-delay:0.2s"><tspan class="dim">NR-26 BootROM rev B</tspan>  <tspan class="wr">secure boot:</tspan> signature <tspan class="ok">OK</tspan>   flash enc: <tspan class="ok">ON</tspan></text>
    <text class="ln" x="24" y="96" style="animation-delay:0.6s"><tspan class="dim">U-Boot 2026.10</tspan>  DRAM: 16 GiB · loading <tspan class="bl">Image</tspan> + <tspan class="bl">nr-26.dtb</tspan></text>
    <text class="ln" x="24" y="120" style="animation-delay:1.0s"><tspan class="dim">Starting kernel ...</tspan></text>
    <text class="ln" x="24" y="150" style="animation-delay:1.4s"><tspan class="ts">[    0.000000]</tspan> Linux version 6.x · Machine model: <tspan class="hi">Nikhil Robinson NR-26</tspan></text>
    <text class="ln" x="24" y="174" style="animation-delay:1.75s"><tspan class="ts">[    0.104211]</tspan> CPU: C, C++, Rust, Bash · <tspan class="ok">4 cores up</tspan></text>
    <text class="ln" x="24" y="198" style="animation-delay:2.1s"><tspan class="ts">[    0.218940]</tspan> spi/i2c/uart/i2s/can/usb: <tspan class="ok">drivers registered</tspan></text>
    <text class="ln" x="24" y="222" style="animation-delay:2.45s"><tspan class="ts">[    0.402117]</tspan> remoteproc0: FreeRTOS + Zephyr real-time core <tspan class="ok">running</tspan></text>
    <text class="ln" x="24" y="246" style="animation-delay:2.8s"><tspan class="ts">[    0.611034]</tspan> npu0: models loaded · vision pipeline <tspan class="ok">ready</tspan></text>
    <text class="ln" x="24" y="270" style="animation-delay:3.15s"><tspan class="ts">[    0.817302]</tspan> rf: wifi0 ble0 lora0 lte0 <tspan class="ok">link up</tspan></text>
    <text class="ln" x="24" y="294" style="animation-delay:3.5s"><tspan class="ts">[    1.003118]</tspan> ros2: sensor fusion + navigation <tspan class="ok">online</tspan></text>
    <text class="ln" x="24" y="324" style="animation-delay:4.0s"><tspan class="ok">Welcome to NR-26.</tspan> All systems nominal.</text>
    <text class="ln" x="24" y="356" style="animation-delay:4.6s"><tspan class="bl">nr-26 login:</tspan> hire_me</text>
    <rect class="cur" x="202" y="343" width="9" height="17" style="animation-delay:5s,5s"/>
  </g>
</svg>
